apiVersion: v1
kind: ServiceAccount
metadata:
  name: docling-serve
  namespace: rag
  labels:
    app: docling-serve
    app.kubernetes.io/part-of: rag
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docling-serve
  namespace: rag
  labels:
    app: docling-serve
    app.kubernetes.io/part-of: rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docling-serve
  template:
    metadata:
      labels:
        app: docling-serve
        app.kubernetes.io/part-of: rag
    spec:
      serviceAccountName: docling-serve
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: docling-serve
          # Pinned to the digest mk4 ran on 2026-11-26 (docling-serve 1.39.0, multi-arch index). rag-api uses its async
          # API (/v1/convert/file/async, /v1/status/poll, /v1/result): check those still exist before upgrading.
          image: ghcr.io/docling-project/docling-serve-cpu:latest@sha256:38d98a8016f6e6220bda0e11d579ffcfa27055d82bbebc22fc346eaf737105dd
          imagePullPolicy: IfNotPresent
          env:
            - name: DOCLING_SERVE_ENABLE_UI
              value: "0"
            - name: DOCLING_SERVE_HOST
              value: "0.0.0.0"
            - name: DOCLING_SERVE_PORT
              value: "5001"
            - name: OMP_NUM_THREADS
              value: "2"
          ports:
            - name: http
              containerPort: 5001
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: docling-serve
  namespace: rag
  labels:
    app: docling-serve
    app.kubernetes.io/part-of: rag
spec:
  type: ClusterIP
  selector:
    app: docling-serve
  ports:
    - name: http
      port: 5001
      targetPort: http
      appProtocol: http
