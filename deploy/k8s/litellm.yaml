# LiteLLM: the OpenAI-compatible proxy in front of the model providers, and its Admin UI at https://jithendar.com/llm/ui
# (README "LiteLLM Admin UI"). Every model is added by hand in the Admin UI and kept in PostgreSQL (STORE_MODEL_IN_DB);
# nothing in Git defines or creates one (litellm_config.yaml has no model_list). The callers' names must exist there:
# claude-sonnet-5-5 and claude-haiku-5-5 (rag-api.yaml), moks-cms-default and moks-cms-fast (jithendar.com's team).
# LiteLLM reloads database models every 30 s and at once in the pod that saved a change, so switching one needs no
# restart and no change here.
#
# Database: litellm on the shared CloudNativePG cluster (postgres-db/postgres-cluster), through PgBouncer in session
# mode. k8s-deployments (vars/mk4.tfvars, postgres_databases.litellm) creates the database, its own login role and
# Secret rag/postgres-db-credentials; nothing here holds a password.
#
# Redis: database 8 of the shared Valkey (redis/valkey-master), ACL user litellm, which can open only that database.
# k8s-deployments (redis_tenants.litellm) writes Secret rag/redis-litellm-credentials. LiteLLM keeps rate-limit and
# spend counters there (shared by every pod) and broadcasts model changes between pods. Not a response cache:
# litellm_settings.cache stays off, so prompts and answers are never stored in Valkey.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm
  namespace: rag
  labels:
    app: litellm
    app.kubernetes.io/part-of: rag
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: rag
  labels:
    app: litellm
    app.kubernetes.io/part-of: rag
data:
  litellm_config.yaml: |
    # No model_list: every model is added in the Admin UI and lives in the database. A model listed here could not be
    # edited or deleted in the UI.
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      # Models, credentials and virtual keys live in PostgreSQL (DATABASE_URL); the Admin UI edits them there.
      store_model_in_db: true
      # Only proxy admins may use the UI when single sign-on is added later (this setting applies to single sign-on
      # only; a user signing in with a password gets the role set on their UI user).
      ui_access_mode: admin_only
      # No sign-in with UI_USERNAME/UI_PASSWORD (or the master key): a shared static secret that makes whoever holds
      # it a proxy admin. The Admin UI then takes only its own users, by email and password (README "Accessing the
      # Admin UI"): turn this on only while such a proxy-admin user can sign in. The master key still works over the
      # API, so a lost password can be reset with it (README, same section).
      disable_env_credential_login: true
      # No per-request rows (prompt metadata, tokens, cost) in the database; keys' spend totals are still counted, so
      # budgets on virtual keys still work.
      disable_spend_logs: true

    litellm_settings:
      drop_params: true
      request_timeout: 120
      num_retries: 2
      set_verbose: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: rag
  labels:
    app: litellm
    app.kubernetes.io/part-of: rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
        app.kubernetes.io/part-of: rag
      annotations:
        # LiteLLM reads litellm_config.yaml only at start, and a ConfigMap change alone restarts nothing. Change this
        # value in the same commit as the ConfigMap above: Argo CD then rolls LiteLLM once, by itself, instead of
        # someone running `kubectl rollout restart` (README "LiteLLM Admin UI" > "Operational warnings" > Memory).
        rag.jithendar.com/litellm-config: "2026-11-28-disable-env-credential-login"
    spec:
      serviceAccountName: litellm
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: litellm
          # Pinned to the digest mk4 ran on 2026-11-26 (LiteLLM 1.112.0.dev2, multi-arch index). To upgrade: pick a
          # release tag, take its digest, change it here, and read README "LiteLLM Admin UI" > "Operational warnings"
          # first (the database schema only moves forward).
          image: ghcr.io/berriai/litellm:main-latest@sha256:a6306e48c148a33b564a0837a987a5d7f37b976b1562b16b8f4accd3b08db26a
          imagePullPolicy: IfNotPresent
          # The image's entrypoint runs the proxy. With DATABASE_URL set it applies the database migrations
          # (`prisma migrate deploy`) before it starts serving, on every start; nothing happens when there are none.
          args:
            - "--config"
            - "/app/config/litellm_config.yaml"
            - "--port"
            - "4000"
            - "--num_workers"
            - "1"
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: ANTHROPIC_API_KEY
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: LITELLM_MASTER_KEY
            # Encrypts what LiteLLM stores in PostgreSQL: provider API keys and credentials added in the UI, model
            # parameters. Required (not optional): without it LiteLLM would encrypt with the master key, and setting
            # a salt key later would leave everything stored until then unreadable. NEVER change it once LiteLLM has
            # written to the database (README "LiteLLM Admin UI" > "Operational warnings").
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: LITELLM_SALT_KEY
            # postgresql://litellm:...@postgres-cluster-pooler-rw.postgres-db.svc.cluster.local:5432/litellm, written
            # by k8s-deployments' Terraform. The pod waits for this Secret, so an apply there goes first.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-db-credentials
                  key: uri
            - name: STORE_MODEL_IN_DB
              value: "True"
            # redis://litellm:...@valkey-master.redis.svc.cluster.local:6379/8. Optional on purpose: LiteLLM uses it
            # when Valkey answers at start-up, and otherwise starts on in-memory counters until its next restart (its
            # log then says "cross-pod coordination stays in-memory"), so Valkey can never keep LiteLLM from starting.
            # If Valkey goes away later, requests go on. Without this Secret LiteLLM runs as before, in memory.
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-litellm-credentials
                  key: uri
                  optional: true
            # The environment sign-in, switched off by general_settings.disable_env_credential_login above. Kept set so
            # that, should that setting ever be removed, the password is UI_PASSWORD and not the master key (LiteLLM's
            # fallback when UI_PASSWORD is unset).
            - name: UI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: LITELLM_UI_USERNAME
            - name: UI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: LITELLM_UI_PASSWORD
            # Served under https://jithendar.com/llm. The gateway keeps the prefix (istio-routing.yaml, VirtualService
            # litellm); LiteLLM strips it before routing, so in-cluster callers keep using
            # http://litellm.rag.svc.cluster.local:4000/v1 without it.
            - name: SERVER_ROOT_PATH
              value: "/llm"
            # The public address: the UI's API base and the Secure flag on the UI's session cookie come from it.
            - name: PROXY_BASE_URL
              value: "https://jithendar.com/llm"
            # Swagger at /llm/docs (LiteLLM's default is the root, which the gateway sends to the UI).
            - name: DOCS_URL
              value: "/docs"
            # The pod's Istio sidecar connects from 127.0.0.6: trust its X-Forwarded-Proto/-For, so redirects
            # LiteLLM builds itself (a UI page without its trailing slash) say https://, not http://.
            - name: FORWARDED_ALLOW_IPS
              value: "127.0.0.6"
          ports:
            - name: http
              containerPort: 4000
          # The first start on an empty database applies every migration: allow it 5 minutes.
          startupProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          # 503 while the database cannot be reached (keys cannot be checked then), which takes this pod out of the
          # Service but does not restart it.
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          # Measured on mk4 2026-11-28 without a database: 1.16 GiB working set, 1.30 GiB in the cgroup, and one
          # extra process (the prisma CLI) was enough to be killed at the old 1.5 GiB limit. With a database the
          # proxy also runs the prisma CLI at every start (migrations) and keeps Prisma's query engine running.
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: rag
  labels:
    app: litellm
    app.kubernetes.io/part-of: rag
spec:
  type: ClusterIP
  selector:
    app: litellm
  ports:
    - name: http
      port: 4000
      targetPort: http
      appProtocol: http
