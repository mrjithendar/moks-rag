apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm
  namespace: rag
  labels:
    app: litellm
    app.kubernetes.io/part-of: rag
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: rag
  labels:
    app: litellm
    app.kubernetes.io/part-of: rag
data:
  litellm_config.yaml: |
    model_list:
      - model_name: claude-sonnet-5-5
        litellm_params:
          model: anthropic/claude-sonnet-5-5
          api_key: os.environ/ANTHROPIC_API_KEY
      - model_name: claude-haiku-5-5
        litellm_params:
          model: anthropic/claude-haiku-5-5
          api_key: os.environ/ANTHROPIC_API_KEY

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      disable_spend_logs: true

    litellm_settings:
      drop_params: true
      request_timeout: 120
      num_retries: 2
      set_verbose: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: rag
  labels:
    app: litellm
    app.kubernetes.io/part-of: rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
        app.kubernetes.io/part-of: rag
    spec:
      serviceAccountName: litellm
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: litellm
          # Pinned to the digest mk4 ran on 2026-11-26 (multi-arch index). To upgrade: pick a release tag, take its
          # digest, change both here, and watch litellm's /health/readiness after the sync.
          image: ghcr.io/berriai/litellm:main-latest@sha256:a6306e48c148a33b564a0837a987a5d7f37b976b1562b16b8f4accd3b08db26a
          imagePullPolicy: IfNotPresent
          args:
            - "--config"
            - "/app/config/litellm_config.yaml"
            - "--port"
            - "4000"
            - "--num_workers"
            - "1"
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: ANTHROPIC_API_KEY
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: LITELLM_MASTER_KEY
          ports:
            - name: http
              containerPort: 4000
          startupProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: rag
  labels:
    app: litellm
    app.kubernetes.io/part-of: rag
spec:
  type: ClusterIP
  selector:
    app: litellm
  ports:
    - name: http
      port: 4000
      targetPort: http
      appProtocol: http
