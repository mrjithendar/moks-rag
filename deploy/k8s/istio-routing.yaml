# Istio routing and zero-trust mesh policies for the `rag` namespace on Hetzner k3s.
#
# Cluster Edge Gateway integration (k8s-deployments/deploy/minikube/istio/edge/values.yaml):
#   Under `root.delegates`, add:
#     - {name: rag, prefix: /rag, to: rag/rag-api}
#     - {name: chat, prefix: /chat, to: rag/open-webui}
#     - {name: qdrant, prefix: /qdrant, to: rag/qdrant}
#
# Open WebUI under `/chat`: its prebuilt SvelteKit bundle assumes `/`; open-webui.yaml's patch_subpath.py
# rewrites it at start-up (and refuses to start if a new build no longer matches).
#
# Qdrant under `/qdrant`: its Web UI and the REST API that UI calls, behind Qdrant's own API key. The UI build is
# patched for the prefix at start-up (deploy/argocd/qdrant-values.yaml, args). gRPC (6334) stays internal.
#
# Strictly internal services (`bge-m3`, `docling-serve`, `litellm`) have NO VirtualService
# and are exposed via ClusterIP only.
---
# Delegate VirtualService for https://jithendar.com/rag -> rag-api:8000
# Owned via delegation from `istio-ingress/jithendar-com` (hence no hosts/gateways fields).
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: rag-api
  namespace: rag
  labels:
    app: rag-api
    app.kubernetes.io/part-of: rag
spec:
  http:
    - name: rag-api-prefix
      match:
        - uri:
            prefix: /rag/
        - uri:
            exact: /rag
      rewrite:
        uri: /
      route:
        - destination:
            host: rag-api.rag.svc.cluster.local
            port:
              number: 8000
---
# Delegate VirtualService for https://jithendar.com/chat -> open-webui:80
# Owned via delegation from `istio-ingress/jithendar-com` (no hosts/gateways fields).
# No timeout field so SSE chat streaming and WebSockets are not truncated.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: open-webui
  namespace: rag
  labels:
    app: open-webui
    app.kubernetes.io/part-of: rag
spec:
  http:
    - name: open-webui-exact
      match:
        - uri:
            exact: /chat
      redirect:
        uri: /chat/
        redirectCode: 308
    - name: open-webui-prefix
      match:
        - uri:
            prefix: /chat/
      rewrite:
        uri: /
      route:
        - destination:
            host: open-webui.rag.svc.cluster.local
            port:
              number: 80
---
# Delegate VirtualService for https://jithendar.com/qdrant -> qdrant:6333: the Web UI at /qdrant/dashboard and the REST
# API it calls under /qdrant/. Without the API key only the version (/qdrant/), /qdrant/livez, /qdrant/readyz and the
# UI's own files answer; everything else is 401. Owned via delegation from `istio-ingress/jithendar-com`.
#
# Cloudflare caches by URL alone (the api-key header is ignored) and keeps what it caches for an hour, so the answer to
# one keyed GET (collections, a point and its payload) would be served to anyone asking for that URL. Qdrant sends no
# Cache-Control, so `no-store` is set on everything except the UI's scripts, styles and fonts, whose file names carry a
# hash of their content. `no-transform` everywhere keeps Cloudflare from rewriting the page or its scripts (Rocket
# Loader left Argo CD's UI blank).
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: qdrant
  namespace: rag
  labels:
    app: qdrant
    app.kubernetes.io/part-of: rag
spec:
  http:
    - name: qdrant-exact
      match:
        - uri:
            exact: /qdrant
      redirect:
        uri: /qdrant/dashboard
        redirectCode: 308
    - name: qdrant-dashboard-assets
      match:
        - uri:
            prefix: /qdrant/dashboard/assets/
      rewrite:
        uri: /dashboard/assets/
      headers:
        response:
          add:
            cache-control: no-transform
      route:
        - destination:
            host: qdrant.rag.svc.cluster.local
            port:
              number: 6333
    - name: qdrant-prefix
      match:
        - uri:
            prefix: /qdrant/
      rewrite:
        uri: /
      headers:
        response:
          set:
            cache-control: no-store, no-transform
      route:
        - destination:
            host: qdrant.rag.svc.cluster.local
            port:
              number: 6333
---
# Enforce STRICT mTLS across all meshed pods in the `rag` namespace.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: rag
  labels:
    app.kubernetes.io/part-of: rag
spec:
  mtls:
    mode: STRICT
---
# Default-deny all inbound mesh requests in `rag` unless explicitly permitted below.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-nothing
  namespace: rag
  labels:
    app.kubernetes.io/part-of: rag
spec: {}
---
# Allow internal `rag` namespace pods (rag-api, open-webui) to call internal RAG services
# (qdrant, docling-serve, litellm, rag-api). `bge-m3` has its own dedicated AuthorizationPolicy.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: rag-internal-services
  namespace: rag
  labels:
    app.kubernetes.io/part-of: rag
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["rag"]
      to:
        - operation:
            ports: ["6333", "6334", "5001", "4000", "8000"]
---
# Allow Istio ingress gateway and internal consumer namespaces (moks-sre, jithendar) to reach rag-api.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: rag-api-callers
  namespace: rag
  labels:
    app: rag-api
    app.kubernetes.io/part-of: rag
spec:
  selector:
    matchLabels:
      app: rag-api
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["istio-ingress", "rag", "moks-sre", "jithendar"]
      to:
        - operation:
            ports: ["8000"]
    # Prometheus (job rag-api) scrapes /metrics on 9464 through the headless Service rag-api-metrics.
    - from:
        - source:
            namespaces: ["monitoring"]
      to:
        - operation:
            ports: ["9464"]
            methods: ["GET"]
---
# Allow Istio ingress gateway to reach open-webui.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: open-webui-ingress
  namespace: rag
  labels:
    app: open-webui
    app.kubernetes.io/part-of: rag
spec:
  selector:
    matchLabels:
      app: open-webui
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["istio-ingress"]
      to:
        - operation:
            ports: ["8080"]
---
# Allow the Istio ingress gateway to reach Qdrant's REST port for https://jithendar.com/qdrant (VirtualService qdrant).
# Qdrant's API key still decides what each request may do; gRPC (6334) and the p2p port stay internal.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: qdrant-ingress
  namespace: rag
  labels:
    app: qdrant
    app.kubernetes.io/part-of: rag
spec:
  selector:
    matchLabels:
      app: qdrant
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["istio-ingress"]
      to:
        - operation:
            ports: ["6333"]
---
# Allow Prometheus (monitoring namespace) to scrape Istio sidecar metrics.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: monitoring-scrape
  namespace: rag
  labels:
    app.kubernetes.io/part-of: rag
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["monitoring"]
      to:
        - operation:
            ports: ["15020", "15090"]
