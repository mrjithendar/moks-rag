apiVersion: v1
kind: ServiceAccount
metadata:
  name: open-webui
  namespace: rag
  labels:
    app: open-webui
    app.kubernetes.io/part-of: rag
automountServiceAccountToken: false
---
# Patches Open WebUI's prebuilt SvelteKit frontend at container startup so it runs natively
# under a subpath (`/chat`) on `https://jithendar.com/chat/` without rebuilding the upstream image.
apiVersion: v1
kind: ConfigMap
metadata:
  name: open-webui-subpath-patch
  namespace: rag
  labels:
    app: open-webui
    app.kubernetes.io/part-of: rag
data:
  patch_subpath.py: |
    #!/usr/bin/env python3
    """Idempotently patch Open WebUI's SvelteKit build to serve cleanly under a subpath."""
    import pathlib
    import re
    import sys

    prefix = (sys.argv[1] if len(sys.argv) > 1 else "/chat").rstrip("/")
    if not prefix.startswith("/"):
        prefix = "/" + prefix

    build_dir = pathlib.Path("/app/build")
    index_path = build_dir / "index.html"
    marker = "/* moks-subpath-shim */"

    shim = (
        f"<script>{marker}(function(){{"
        f'var P="{prefix}";'
        r'var R=/^\/(api|ollama|openai|static|_app|ws|assets|audio|images|videos|cache|pyodide|manifest\.json|opensearch\.xml|favicon)(\/|$|\?)/;'
        r'function rw(u){if(typeof u!=="string")return u;'
        r'if(u.indexOf(P+"/")===0||u===P)return u;'
        r'if(R.test(u))return P+u;'
        r'if(/^wss?:\/\/[^/]+\/ws\//.test(u))return u.replace(/^(wss?:\/\/[^/]+)(\/ws\/)/,"$1"+P+"$2");'
        r'if(u.indexOf(location.origin+"/")===0&&R.test(u.slice(location.origin.length)))return location.origin+P+u.slice(location.origin.length);'
        r'return u;}'
        r'function rwPath(u){if(typeof u!=="string")return u;'
        r'if(u.indexOf(P+"/")===0||u===P)return u;'
        r'if(u.charAt(0)==="/"&&u.charAt(1)!=="/")return P+u;'
        r'return u;}'
        r'var F=window.fetch;window.fetch=function(i,n){'
        r'if(typeof i==="string")i=rw(i);'
        r'else if(i instanceof Request){var nu=rw(i.url);if(nu!==i.url)i=new Request(nu,i);}'
        r'return F.call(this,i,n);};'
        r'var O=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(m,u){'
        r'var a=Array.prototype.slice.call(arguments);a[1]=rw(u);return O.apply(this,a);};'
        r'var W=window.WebSocket;function WrappedWS(u,p){return p!==undefined?new W(rw(u),p):new W(rw(u));}'
        r'WrappedWS.prototype=W.prototype;WrappedWS.CONNECTING=W.CONNECTING;WrappedWS.OPEN=W.OPEN;'
        r'WrappedWS.CLOSING=W.CLOSING;WrappedWS.CLOSED=W.CLOSED;window.WebSocket=WrappedWS;'
        r'if(window.EventSource){var E=window.EventSource;function WrappedES(u,c){return new E(rw(u),c);}'
        r'WrappedES.prototype=E.prototype;window.EventSource=WrappedES;}'
        r'var SA=Element.prototype.setAttribute;Element.prototype.setAttribute=function(k,v){'
        r'if(typeof v==="string"){if(k==="src")v=rw(v);else if(k==="href")v=this.tagName==="A"?rwPath(v):rw(v);}'
        r'return SA.call(this,k,v);};'
        r'var ID=Object.getOwnPropertyDescriptor(HTMLImageElement.prototype,"src");'
        r'if(ID&&ID.set){Object.defineProperty(HTMLImageElement.prototype,"src",{'
        r'get:ID.get,set:function(v){ID.set.call(this,rw(v));},configurable:true});}'
        r'document.addEventListener("click",function(ev){'
        r'var a=ev.target&&ev.target.closest?ev.target.closest("a[href]"):null;'
        r'if(!a)return;var h=a.getAttribute("href");'
        r'if(h&&h.charAt(0)==="/"&&h.charAt(1)!=="/"&&h.indexOf(P+"/")!==0&&h!==P){'
        r'SA.call(a,"href",P+h);}},true);'
        r"})();</script>"
    )

    if index_path.exists():
        html = index_path.read_text(encoding="utf-8")
        if marker not in html:
            html = html.replace('href="/', f'href="{prefix}/')
            html = html.replace('src="/', f'src="{prefix}/')
            html = html.replace('import("/_app/', f'import("{prefix}/_app/')
            html = html.replace('base: ""', f'base: "{prefix}"')
            html = html.replace("<head>", "<head>\n\t\t" + shim, 1)
            index_path.write_text(html, encoding="utf-8")
            print(f"[subpath-patch] patched {index_path} for {prefix}")

    # Patch SvelteKit client URL resolver (ne) so goto('/auth') etc. stay under /chat,
    # and patch Socket.IO path '/ws/socket.io' -> '/chat/ws/socket.io'.
    ne_re = re.compile(
        r"if\(([a-zA-Z_$][\w$]*) instanceof URL\)return \1;let ([a-zA-Z_$][\w$]*)=document\.baseURI;"
    )
    patched_ne = 0
    patched_ws = 0
    immutable = build_dir / "_app" / "immutable"
    if immutable.exists():
        for js in immutable.rglob("*.js"):
            txt = js.read_text(encoding="utf-8", errors="ignore")
            orig = txt
            if f'"{prefix}/ws/socket.io"' not in txt and '"/ws/socket.io"' in txt:
                txt = txt.replace('"/ws/socket.io"', f'"{prefix}/ws/socket.io"')
                patched_ws += 1
            if f'"{prefix}/"' not in txt and ne_re.search(txt):
                def _repl(m: re.Match[str]) -> str:
                    arg, base_var = m.group(1), m.group(2)
                    guard = (
                        f'if(typeof {arg}==="string"&&{arg}.startsWith("/")&&!{arg}.startsWith("//")'
                        f'&&!{arg}.startsWith("{prefix}/")&&{arg}!=="{prefix}"){arg}="{prefix}"+{arg};'
                    )
                    return f"{guard}if({arg} instanceof URL)return {arg};let {base_var}=document.baseURI;"

                txt = ne_re.sub(_repl, txt, count=1)
                patched_ne += 1
            if txt != orig:
                js.write_text(txt, encoding="utf-8")

    print(f"[subpath-patch] done: prefix={prefix}, patched_ne={patched_ne}, patched_ws={patched_ws}")

    # Verify the result instead of trusting the counters (a restart of the same container finds files patched
    # already). If this build's frontend no longer matches, refuse to start: a crash-looping pod is visible in
    # Argo CD, a /chat that silently loads nothing is not.
    problems = []
    if index_path.exists() and marker not in index_path.read_text(encoding="utf-8"):
        problems.append("index.html has no subpath shim")
    if immutable.exists():
        texts = [p.read_text(encoding="utf-8", errors="ignore") for p in immutable.rglob("*.js")]
        if not any(f'"{prefix}/ws/socket.io"' in t for t in texts):
            problems.append("no bundle uses the prefixed Socket.IO path")
        if not any(f'="{prefix}"+' in t for t in texts):
            problems.append("SvelteKit URL resolver was not patched")
    else:
        problems.append(f"{immutable} not found")
    if problems:
        print("[subpath-patch] FAILED: " + "; ".join(problems), file=sys.stderr)
        sys.exit(1)
---
# Uses `local-path` because Hetzner CSI (`hcloud-volumes`) enforces a 10Gi minimum volume size.
# Switch to `hcloud-volumes` (and bump to 10Gi) if you prefer node-portable persistence.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: rag
  labels:
    app: open-webui
    app.kubernetes.io/part-of: rag
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: rag
  labels:
    app: open-webui
    app.kubernetes.io/part-of: rag
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
        app.kubernetes.io/part-of: rag
    spec:
      serviceAccountName: open-webui
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: open-webui
          # Pinned to the digest mk4 ran on 2026-11-26 (multi-arch index). patch_subpath.py rewrites this build's
          # minified frontend; after an upgrade it refuses to start if the patch no longer applies.
          image: ghcr.io/open-webui/open-webui:main@sha256:ff7f7cbb4545aacec2c22d085b2bc406b299c119bd98747421124a1a6c03795f
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - export OPENAI_API_KEY="${OPEN_WEBUI_RAG_TOKEN:-$OPENAI_API_KEY}"; python3 /patches/patch_subpath.py /chat && exec bash /app/backend/start.sh
          env:
            - name: OPENAI_API_BASE_URL
              value: "http://rag-api.rag.svc.cluster.local:8000/v1"
            # rag-api token: OPEN_WEBUI_RAG_TOKEN (read-only, scripts/issue-service-token.sh open-webui) when it
            # exists, else the shared token. Open WebUI keeps connection settings in its database once they are
            # saved in Admin -> Settings -> Connections; then update the key there too (README "Access").
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: RAG_BEARER_TOKEN
            - name: OPEN_WEBUI_RAG_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: OPEN_WEBUI_RAG_TOKEN
                  optional: true
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: WEBUI_SECRET_KEY
            - name: ENABLE_OLLAMA_API
              value: "false"
            - name: WEBUI_AUTH
              value: "true"
            - name: ENABLE_SIGNUP
              value: "false"
            - name: WEBUI_URL
              value: "https://jithendar.com/chat"
            - name: DATA_DIR
              value: "/app/backend/data"
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
            - name: subpath-patch
              mountPath: /patches
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
        - name: subpath-patch
          configMap:
            name: open-webui-subpath-patch
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: rag
  labels:
    app: open-webui
    app.kubernetes.io/part-of: rag
spec:
  type: ClusterIP
  selector:
    app: open-webui
  ports:
    - name: http
      port: 80
      targetPort: http
      appProtocol: http
