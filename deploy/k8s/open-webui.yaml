apiVersion: v1
kind: ServiceAccount
metadata:
  name: open-webui
  namespace: rag
  labels:
    app: open-webui
    app.kubernetes.io/part-of: rag
automountServiceAccountToken: false
---
# Uses `local-path` because Hetzner CSI (`hcloud-volumes`) enforces a 5–10Gi minimum volume size.
# Switch to `hcloud-volumes` (and bump to 10Gi) if you prefer node-portable persistence.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: rag
  labels:
    app: open-webui
    app.kubernetes.io/part-of: rag
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: rag
  labels:
    app: open-webui
    app.kubernetes.io/part-of: rag
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
        app.kubernetes.io/part-of: rag
    spec:
      serviceAccountName: open-webui
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          imagePullPolicy: IfNotPresent
          env:
            - name: OPENAI_API_BASE_URL
              value: "http://rag-api.rag.svc.cluster.local:8000/v1"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: RAG_BEARER_TOKEN
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: WEBUI_SECRET_KEY
            - name: ENABLE_OLLAMA_API
              value: "false"
            - name: WEBUI_AUTH
              value: "true"
            - name: ENABLE_SIGNUP
              value: "false"
            - name: WEBUI_URL
              value: "https://chat.jithendar.com"
            - name: DATA_DIR
              value: "/app/backend/data"
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: rag
  labels:
    app: open-webui
    app.kubernetes.io/part-of: rag
spec:
  type: ClusterIP
  selector:
    app: open-webui
  ports:
    - name: http
      port: 80
      targetPort: http
      appProtocol: http
