apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: moks-rag-qdrant
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: moks-rag
  sources:
    - repoURL: https://qdrant.github.io/qdrant-helm
      chart: qdrant
      # Pinned to the chart mk4 ran on 2026-11-26 (Qdrant v1.20.2). Upgrade by changing it here.
      targetRevision: "1.20.2"
      helm:
        releaseName: qdrant
        valueFiles:
          - $values/deploy/argocd/qdrant-values.yaml
    - repoURL: https://github.com/mrjithendar/moks-rag.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: rag
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
