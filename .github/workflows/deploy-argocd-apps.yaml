name: Deploy ArgoCD Applications

# validate → pull requests touching deploy/: the Argo CD files parse and the Kustomize stack (deploy/k8s) renders.
# deploy   → pushes to main touching deploy/argocd/ (and manual runs on main): apply the AppProject and the two
#            Applications with ServiceAccount argocd/github-rag-argocd-deployer (deploy/argocd/ci-rbac.yaml; vars
#            K8S_API_SERVER, K8S_CA_DATA, secret K8S_ARGOCD_TOKEN), then refresh them and report their status.
# deploy/k8s itself is never applied from here: Argo CD (moks-rag-stack) syncs it from main.

on:
  push:
    branches: [main]
    paths:
      - "deploy/argocd/**"
      - ".github/workflows/deploy-argocd-apps.yaml"
  pull_request:
    branches: [main]
    paths:
      - "deploy/argocd/**"
      - "deploy/k8s/**"
      - ".github/workflows/deploy-argocd-apps.yaml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run kubectl apply with --dry-run=server without modifying the cluster"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-argocd-apps-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate ArgoCD & Kustomize Manifests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.35.0

      - name: Validate YAML syntax
        run: |
          pip install --quiet pyyaml==6.0.3
          python3 - <<'EOF'
          import pathlib, yaml
          for p in sorted(pathlib.Path("deploy/argocd").glob("*.yaml")):
              docs = list(yaml.safe_load_all(p.read_text(encoding="utf-8")))
              assert docs, f"Empty YAML file: {p}"
              print(f"YAML OK ({len(docs)} docs): {p}")
          EOF

      - name: Render Kustomize stack
        run: kubectl kustomize deploy/k8s > /dev/null

  deploy:
    name: Apply ArgoCD Apps to Hetzner k3s
    needs: validate
    # Only main is deployed: a manual run on another branch would apply that branch's Applications.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.35.0

      - name: Configure kubeconfig
        env:
          K8S_API_SERVER: ${{ vars.K8S_API_SERVER }}
          K8S_CA_DATA: ${{ vars.K8S_CA_DATA }}
          K8S_ARGOCD_TOKEN: ${{ secrets.K8S_ARGOCD_TOKEN }}
        run: |
          set -euo pipefail
          for v in K8S_API_SERVER K8S_CA_DATA K8S_ARGOCD_TOKEN; do
            [[ -n "${!v}" ]] || { echo "::error::$v is not set (vars K8S_API_SERVER, K8S_CA_DATA; secret K8S_ARGOCD_TOKEN)"; exit 1; }
          done
          KCFG="$RUNNER_TEMP/kubeconfig"
          umask 077
          cat > "$KCFG" <<EOF
          apiVersion: v1
          kind: Config
          clusters:
          - name: hetzner-k3s
            cluster:
              server: ${K8S_API_SERVER}
              certificate-authority-data: ${K8S_CA_DATA}
          users:
          - name: github-rag-argocd-deployer
            user:
              token: ${K8S_ARGOCD_TOKEN}
          contexts:
          - name: hetzner-k3s
            context:
              cluster: hetzner-k3s
              user: github-rag-argocd-deployer
              namespace: argocd
          current-context: hetzner-k3s
          EOF
          echo "KUBECONFIG=$KCFG" >> "$GITHUB_ENV"
          kubectl --kubeconfig "$KCFG" --request-timeout=20s get --raw /readyz > /dev/null

      - name: Apply ArgoCD AppProject and Applications
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [[ "$DRY_RUN" == "true" ]]; then
            EXTRA_ARGS+=(--dry-run=server)
          fi
          kubectl apply "${EXTRA_ARGS[@]}" -f deploy/argocd/project.yaml
          kubectl apply "${EXTRA_ARGS[@]}" -f deploy/argocd/qdrant-app.yaml
          kubectl apply "${EXTRA_ARGS[@]}" -f deploy/argocd/rag-stack-app.yaml

      - name: Trigger ArgoCD refresh and check status
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          apps=(moks-rag-qdrant moks-rag-stack)
          for app in "${apps[@]}"; do
            kubectl -n argocd annotate application "$app" argocd.argoproj.io/refresh=hard --overwrite
          done
          # Up to 3 minutes for Argo CD to reconcile. Not reaching Synced/Healthy is reported, not failed: a sync can
          # legitimately take longer (Qdrant's StatefulSet), and Argo CD keeps going after this job.
          status() { kubectl -n argocd get application "$1" -o jsonpath='{.status.sync.status}/{.status.health.status}'; }
          for attempt in $(seq 1 18); do
            line="" ready=true
            for app in "${apps[@]}"; do
              s=$(status "$app"); line+=" $app=$s"
              [[ "$s" == Synced/Healthy ]] || ready=false
            done
            echo "Attempt ${attempt}:${line}"
            [[ "$ready" == true ]] && break
            sleep 10
          done
          [[ "$ready" == true ]] || echo "::warning::Not Synced/Healthy after 3 minutes:${line}"
          {
            echo "### ArgoCD Application Status"
            echo '```'
            kubectl -n argocd get applications "${apps[@]}"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Clean up kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig"
