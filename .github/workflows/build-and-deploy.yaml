name: Build and Deploy rag-api

# test           → every run: ruff (lint + format) and pytest.
# image-check    → pull requests: build the image (nothing pushed) next to the tests, so a broken Dockerfile or a model
#                  download whose sha256 no longer matches fails before merge instead of after it.
# build-and-push → pushes to main (and manual runs on main), after `test`: push ghcr.io/<owner>/moks-rag-api:<sha>
#                  and :latest.
# update-manifests → then commit the new tag to deploy/k8s/kustomization.yaml; Argo CD (moks-rag-stack) rolls it out.
#
# arm64 only, built natively on GitHub's arm64 runner: the cluster's nodes are arm64 and the image bakes in the
# reranker's arm64-quantised ONNX file (RERANKER_FILE in app/Dockerfile). Layers are cached in the GitHub Actions
# cache (written by main, read by pull requests).

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-and-deploy.yaml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-and-deploy.yaml"
  workflow_dispatch:

permissions:
  contents: read

# Pull requests: a new push cancels the run it replaces. main: one run at a time, never cancelled half way (the
# manifest bump must follow the image it names).
concurrency:
  group: build-and-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint and Test rag-api
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image's Python (app/Dockerfile: python:3.12-slim).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/pyproject.toml

      - name: Install dependencies
        run: pip install --quiet -e ".[dev]"

      - name: Ruff lint and format check
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: pytest
        run: pytest -q

  image-check:
    name: Build Container Image (PR check)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha

  build-and-push:
    name: Build and Push Container Image
    needs: test
    # Only main is deployed: a manual run on another branch would otherwise bump main's manifest to that branch's image.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.meta.outputs.image_name }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute image coordinates
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "image_name=ghcr.io/${OWNER,,}/moks-rag-api" >> "$GITHUB_OUTPUT"
          echo "image_tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log out
        if: always()
        run: docker logout ghcr.io

  update-manifests:
    name: Update Kustomize Image Tag
    needs: build-and-push
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # The token stays in the checkout: the next step pushes the commit with it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Commit the new tag to deploy/k8s/kustomization.yaml
        env:
          IMAGE_NAME: ${{ needs.build-and-push.outputs.image_name }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bump() {
            python3 - <<'EOF'
          import os, re
          from pathlib import Path

          path = Path("deploy/k8s/kustomization.yaml")
          content = path.read_text(encoding="utf-8")
          content = re.sub(r"(newName:\s*).+", rf"\g<1>{os.environ['IMAGE_NAME']}", content, count=1)
          content = re.sub(r"(newTag:\s*).+", rf"\g<1>{os.environ['IMAGE_TAG']}", content, count=1)
          path.write_text(content, encoding="utf-8")
          EOF
          }
          bump
          if git diff --quiet deploy/k8s/kustomization.yaml; then
            echo "deploy/k8s/kustomization.yaml already names ${IMAGE_TAG:0:7}."
            exit 0
          fi
          git diff deploy/k8s/kustomization.yaml
          git commit -qm "chore(deploy): bump rag-api image to ${IMAGE_TAG:0:7} [skip ci]" deploy/k8s/kustomization.yaml
          # main may have moved since the checkout (a merge during the build): rebase onto it and retry.
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            echo "Push rejected (attempt $attempt of 3); rebasing onto origin/main."
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; git reset -q --hard origin/main; bump; git commit -qm "chore(deploy): bump rag-api image to ${IMAGE_TAG:0:7} [skip ci]" deploy/k8s/kustomization.yaml; }
          done
          echo "::error::Could not push the manifest bump to main after 3 attempts"
          exit 1
